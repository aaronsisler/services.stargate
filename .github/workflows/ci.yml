# Lints, type-checks, and deploys on pushes and pull requests targeting main.
# Deploys to prod on push (post-merge), beta on pull requests.
#
# Pull requests deploy to beta with a synthetic, uncommitted version
# (base version + run number + short SHA) so each beta deploy is traceable
# back to the exact Action run and commit, without ever pushing to the PR
# branch. Pushes to main bump the real minor version and commit it, since
# that's the one history we actually want tracked; that push is made with
# the workflow's own token, which GitHub attributes to the github-actions[bot]
# actor, so the job-level `if` below skips the resulting follow-up run and
# avoids a commit loop.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run build

      - name: Bump and commit version
        if: github.event_name == 'push'
        run: |
          npm version minor --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version")"
          git push

      - name: Compute preview version
        if: github.event_name == 'pull_request'
        run: |
          base_version="$(node -p "require('./package.json').version")"
          short_sha="$(git rev-parse --short HEAD)"
          echo "APP_VERSION=${base_version}-beta.${{ github.run_number }}+${short_sha}" >> "$GITHUB_ENV"

      - name: Deploy
        run: npm run deploy -- ${{ github.event_name == 'push' && 'prod' || 'beta' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
