# Lints, type-checks, and deploys on pushes and pull requests targeting main.
# Deploys to prod on push (post-merge), beta on pull requests.
#
# Each build also bumps the app version and commits it back to the branch:
# minor on push to main, patch on pull requests. That commit is pushed using
# the workflow's own token, which GitHub attributes to the github-actions[bot]
# actor, so the job is skipped whenever it is the trigger (see the job-level
# `if` below) — this avoids a commit loop without relying on commit message
# text, which would otherwise leak into merge/squash commits on main and
# suppress the real post-merge deploy.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run build

      - name: Bump version
        id: bump
        run: |
          npm version ${{ github.event_name == 'push' && 'minor' || 'patch' }} --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push

      - name: Deploy
        run: npm run deploy -- ${{ github.event_name == 'push' && 'prod' || 'beta' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
