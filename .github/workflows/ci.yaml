# Lints, type-checks, and deploys on pushes and pull requests targeting main.
# Deploys to prod on push (post-merge), beta on pull requests.
#
# Pull requests deploy to beta with an uncommitted version (base version +
# PR head commit SHA) so each deploy is traceable via `git show <sha>`,
# without pushing to the PR branch. Pushes to main bump and commit the real
# minor version, using a token from the aaronsisler-ci-integration-app
# GitHub App (which is on the main ruleset's bypass list, since it's the
# only actor allowed to push straight to main). That push is attributed to
# aaronsisler-ci-integration-app[bot], which the job-level `if` below skips
# to avoid a commit loop.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Build:
    runs-on: ubuntu-latest
    if: github.actor != 'aaronsisler-ci-integration-app[bot]'
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run build

      - name: Bump and commit version
        if: github.event_name == 'push'
        run: |
          npm version minor --no-git-tag-version
          git config user.name "aaronsisler-ci-integration-app[bot]"
          git config user.email "aaronsisler-ci-integration-app[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version")"
          git push

      - name: Compute preview version
        if: github.event_name == 'pull_request'
        run: |
          base_version="$(node -p "require('./package.json').version")"
          commit_sha="${{ github.event.pull_request.head.sha }}"
          echo "APP_VERSION=${base_version}-beta+${commit_sha:0:7}" >> "$GITHUB_ENV"

      - name: Deploy
        run: npm run deploy -- ${{ github.event_name == 'push' && 'prod' || 'beta' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
