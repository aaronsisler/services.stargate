name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Build:
    runs-on: ubuntu-latest
    if: github.actor != 'aaronsisler-ci-integration-app[bot]'
    steps:
      # Needed to push to main below; App is on the ruleset's bypass list.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_INTEGRATION_CLIENT_ID }}
          private-key: ${{ secrets.CI_INTEGRATION_PRIVATE_KEY }}

      # Use the app token so the later push is attributed to the bot.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run build

      # Real version bump, committed straight to main (push only).
      - name: Bump and commit version
        if: github.event_name == 'push'
        run: |
          npm version minor --no-git-tag-version
          git config user.name "aaronsisler-ci-integration-app[bot]"
          git config user.email "aaronsisler-ci-integration-app[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version")"
          git push

      # Uncommitted version for traceable beta deploys (PR only).
      - name: Compute preview version
        if: github.event_name == 'pull_request'
        run: |
          base_version="$(node -p "require('./package.json').version")"
          commit_sha="${{ github.event.pull_request.head.sha }}"
          echo "APP_VERSION=${base_version}-beta+${commit_sha:0:7}" >> "$GITHUB_ENV"

      - name: Deploy
        run: npm run deploy -- ${{ github.event_name == 'push' && 'prod' || 'beta' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
