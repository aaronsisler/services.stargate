service: stargate

provider:
  name: aws
  runtime: nodejs24.x
  stage: beta
  region: us-east-1
  logRetentionInDays: 14
  iam:
    role: arn:aws:iam::654918520080:role/API-LAMBDA-SES
  apiGateway:
    shouldStartNameWithService: true
    usagePlan:
      quota:
        limit: 500
        offset: 0
        period: MONTH
      throttle:
        burstLimit: 20
        rateLimit: 10
    resourcePolicy:
      - Effect: Allow
        Principal: "*"
        Action: execute-api:Invoke
        Resource:
          - execute-api:/*/GET/*
          - execute-api:/*/POST/*
          - execute-api:/*/OPTIONS/*
  environment:
    NODE_ENV: beta
    APP_VERSION: ${file(./package.json):version}

package:
  exclude:
    - src/**
    - deployment/**
    - "**.*"

functions:
  info:
    handler: dist/info/index.handler
    description: Gateway info endpoint. Responds with current time and the current application version.
    events:
      - http:
          path: /info
          method: GET

  email-v2:
    handler: dist/email-v2/index.handler
    description: Used to send email with Simple Email Service (SES)
    events:
      - http:
          path: /email/v2
          method: POST
          cors:
            headers: ${file(./deployment/cors.json):headers}

  email:
    handler: dist/email/index.handler
    description: Used to send email with Simple Email Service (SES)
    events:
      - http:
          path: /email
          method: POST
          cors:
            headers: ${file(./deployment/cors.json):headers}

  email-with-attachment-v2:
    handler: dist/email-with-attachment-v2/index.handler
    description: Used to send email containing attachment with NodeMailer and Simple Email Service (SES)
    events:
      - http:
          path: /email-with-attachment/v2
          method: POST
          cors:
            headers: ${file(./deployment/cors.json):headers}

  email-with-attachment:
    handler: dist/email-with-attachment/index.handler
    description: Used to send email containing attachment with NodeMailer and Simple Email Service (SES)
    events:
      - http:
          path: /email-with-attachment
          method: POST
          cors:
            headers: ${file(./deployment/cors.json):headers}

plugins:
  - serverless-domain-manager

custom:
  customDomain:
    domainName: services.eandbsolutions.com
    basePath: "beta"
    stage: beta
    createRoute53Record: true
